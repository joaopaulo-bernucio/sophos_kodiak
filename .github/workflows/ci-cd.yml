name: Sophos Kodiak CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.32.3'
  POSTGRES_VERSION: '15.8'
  # CI sempre usa PostgreSQL local na porta 5432 para testes
  POSTGRES_PORT: '5432'
  # Configurações fixas para testes - NÃO usar secrets
  CI_DB_HOST: 'localhost'
  CI_DB_PORT: '5432'
  CI_DB_NAME: 'test_db'
  CI_DB_USER: 'postgres'
  CI_DB_PASSWORD: 'postgres'
  CI_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
  # Variáveis de produção (secrets) - apenas para deploy
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  # ===========================================
  # SMOKE TESTS - Validação rápida e básica
  # ===========================================
  smoke-tests:
    name: 🚀 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        component: [backend, frontend]

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend smoke tests
    - name: Setup Python (Backend)
      if: matrix.component == 'backend'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install Python dependencies (Backend)
      if: matrix.component == 'backend'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: ./backend

    - name: Setup test database
      if: matrix.component == 'backend'
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d test_db -f - <<EOF
        CREATE TABLE IF NOT EXISTS departamentos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          orcamento DECIMAL(15,2)
        );
        CREATE TABLE IF NOT EXISTS funcionarios (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          cargo VARCHAR(100),
          salario DECIMAL(10,2),
          departamento_id INTEGER REFERENCES departamentos(id)
        );
        CREATE TABLE IF NOT EXISTS logs_perguntas (
          id SERIAL PRIMARY KEY,
          pergunta TEXT NOT NULL,
          sql_gerada TEXT,
          resposta TEXT,
          sucesso BOOLEAN DEFAULT FALSE,
          data_hora TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );
        EOF

    - name: Run backend smoke tests
      if: matrix.component == 'backend'
      working-directory: ./backend
      env:
        # FORÇAR uso do banco local de teste - NUNCA usar secrets em testes
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        GEMINI_API_KEY: ${{ env.GEMINI_API_KEY || 'test_key_for_ci' }}
        PYTHONPATH: ${{ github.workspace }}/backend
        CI: true
        GITHUB_ACTIONS: true
      run: pytest -m smoke -v --tb=short --maxfail=3

    # Frontend smoke tests
    - name: Setup Flutter (Frontend)
      if: matrix.component == 'frontend'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        cache-key: flutter-smoke-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
        architecture: x64

    - name: Setup Java for Android
      if: matrix.component == 'frontend'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Validate and get Flutter dependencies
      if: matrix.component == 'frontend'
      timeout-minutes: 10
      run: |
        # Verificar se Flutter foi instalado corretamente
        echo "🔧 Verificando instalação do Flutter..."
        flutter --version

        # Validar pubspec.yaml
        echo "📋 Validando pubspec.yaml..."
        flutter pub deps --style=tree > /dev/null
        echo "✅ pubspec.yaml válido"

        # Instalar dependências com retry em caso de falha
        echo "📦 Instalando dependências..."
        for i in {1..3}; do
          if flutter pub get; then
            echo "✅ Dependências instaladas com sucesso"
            break
          else
            echo "⚠️ Tentativa $i falhou, tentando novamente..."
            sleep 2
            if [ $i -eq 3 ]; then
              echo "❌ Falha ao instalar dependências após 3 tentativas"
              exit 1
            fi
          fi
        done
      working-directory: ./mobile

    - name: Analyze Flutter code
      if: matrix.component == 'frontend'
      run: flutter analyze
      working-directory: ./mobile

    - name: Run Flutter smoke tests
      if: matrix.component == 'frontend'
      env:
        FLUTTER_TEST: true
      run: |
        # Execute smoke test básico - verificar se arquivo existe primeiro
        if [ -f "test/widget/widget_test.dart" ]; then
          echo "🧪 Executando smoke test específico..."
          flutter test test/widget/widget_test.dart --reporter expanded
        elif [ -f "test/widget/app_test.dart" ]; then
          echo "🧪 Executando teste alternativo do app..."
          flutter test test/widget/app_test.dart --reporter expanded
        else
          echo "🧪 Executando todos os testes disponíveis..."
          flutter test --reporter expanded
        fi

        # Verificação rápida da estrutura de testes
        echo "📁 Verificando estrutura de testes..."
        if [ -d "test/unit/" ]; then
          echo "✅ Diretório unit/ encontrado"
        fi
        if [ -d "test/widget/" ]; then
          echo "✅ Diretório widget/ encontrado"
        fi
      working-directory: ./mobile

  # ===========================================
  # COMPREHENSIVE TESTS - Suíte completa de testes
  # ===========================================
  comprehensive-tests:
    name: 🧪 Comprehensive Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-tests

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python with cache
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies and tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-html flake8
        # Instalar modelo spaCy apenas se não existir
        python -c "import spacy; spacy.load('pt_core_news_sm')" 2>/dev/null || python -m spacy download pt_core_news_sm
      working-directory: ./backend

    - name: Setup comprehensive test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d test_db -f - <<EOF
        -- Complete database structure for comprehensive tests
        CREATE TABLE IF NOT EXISTS departamentos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          orcamento DECIMAL(15,2)
        );

        CREATE TABLE IF NOT EXISTS funcionarios (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          cargo VARCHAR(100),
          salario DECIMAL(10,2),
          departamento_id INTEGER REFERENCES departamentos(id)
        );

        CREATE TABLE IF NOT EXISTS clientes (
          id SERIAL PRIMARY KEY,
          nome_empresa VARCHAR(200) NOT NULL,
          data_cadastro DATE DEFAULT CURRENT_DATE
        );

        CREATE TABLE IF NOT EXISTS projetos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(200) NOT NULL,
          status VARCHAR(50),
          orcamento DECIMAL(15,2),
          cliente_id INTEGER REFERENCES clientes(id),
          responsavel_id INTEGER REFERENCES funcionarios(id),
          data_inicio DATE DEFAULT CURRENT_DATE,
          data_termino DATE
        );

        CREATE TABLE IF NOT EXISTS vendas (
          id SERIAL PRIMARY KEY,
          valor DECIMAL(15,2) NOT NULL,
          data_venda DATE DEFAULT CURRENT_DATE,
          projeto_id INTEGER REFERENCES projetos(id),
          funcionario_id INTEGER REFERENCES funcionarios(id),
          status_pagamento VARCHAR(50) DEFAULT 'Pendente'
        );

        CREATE TABLE IF NOT EXISTS contratos_marketing (
          id SERIAL PRIMARY KEY,
          descricao TEXT,
          valor DECIMAL(15,2),
          valor_total DECIMAL(15,2),
          cliente_id INTEGER REFERENCES clientes(id),
          data_inicio DATE DEFAULT CURRENT_DATE,
          data_termino DATE,
          status VARCHAR(50) DEFAULT 'Ativo'
        );

        CREATE TABLE IF NOT EXISTS logs_perguntas (
          id SERIAL PRIMARY KEY,
          pergunta TEXT NOT NULL,
          sql_gerada TEXT,
          resposta TEXT,
          sucesso BOOLEAN DEFAULT FALSE,
          data_hora TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );

        -- Test data
        INSERT INTO departamentos (nome, orcamento) VALUES
        ('Vendas', 100000.00),
        ('Marketing', 80000.00),
        ('Criação', 60000.00);

        INSERT INTO funcionarios (nome, cargo, salario, departamento_id) VALUES
        ('João Silva', 'Gerente', 5000.00, 1),
        ('Maria Santos', 'Analista', 4000.00, 2);

        INSERT INTO clientes (nome_empresa) VALUES
        ('Empresa Alpha'),
        ('Beta Corporation');
        EOF

    - name: Code quality check
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      working-directory: ./backend

    - name: Run comprehensive test suite
      working-directory: ./backend
      env:
        # FORÇAR uso do banco local de teste - NUNCA usar secrets em testes
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_for_ci' }}
        CI: true
        GITHUB_ACTIONS: true
      run: |
        # Execute todos os testes principais com cobertura
        pytest \
          test/test_critical_infrastructure.py \
          test/test_data_quality.py \
          test/test_endpoints.py \
          test/test_infrastructure.py \
          test/test_real_scenarios.py \
          test/test_security.py \
          test/test_smoke.py \
          test/unit/ \
          test/performance/ \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --tb=short \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: comprehensive-test-results
        path: |
          backend/htmlcov/
          backend/.coverage

  # ===========================================
  # COMPREHENSIVE FLUTTER TESTS - Suíte completa de testes Flutter
  # ===========================================
  comprehensive-flutter-tests:
    name: 📱 Comprehensive Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        cache-key: flutter-comprehensive-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
        architecture: x64

    - name: Setup Java for Android
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Validate and get Flutter dependencies
      timeout-minutes: 10
      env:
        FLUTTER_TEST: true
      run: |
        # Verificar se Flutter foi instalado corretamente
        echo "🔧 Verificando instalação do Flutter..."
        flutter --version

        # Validar pubspec.yaml
        echo "📋 Validando pubspec.yaml..."
        flutter pub deps --style=tree > /dev/null
        echo "✅ pubspec.yaml válido"

        # Instalar dependências com retry
        echo "📦 Instalando dependências..."
        for i in {1..3}; do
          if flutter pub get; then
            echo "✅ Dependências instaladas com sucesso"
            break
          else
            echo "⚠️ Tentativa $i falhou, tentando novamente..."
            sleep 2
            if [ $i -eq 3 ]; then
              echo "❌ Falha ao instalar dependências após 3 tentativas"
              exit 1
            fi
          fi
        done

        # Verificar arquivos de teste
        echo "📋 Arquivos de teste encontrados:"
        find test/ -name "*.dart" -type f | head -10
      working-directory: ./mobile

    - name: Run code analysis
      run: flutter analyze
      working-directory: ./mobile

    - name: Run unit tests
      env:
        FLUTTER_TEST: true
      run: |
        echo "🧪 Executando Unit Tests..."
        if [ -d "test/unit/" ] && [ "$(ls -A test/unit/)" ]; then
          flutter test test/unit/ --reporter expanded --coverage
        else
          echo "⚠️ Diretório test/unit/ vazio ou não encontrado"
          echo "ℹ️ Pulando unit tests"
        fi
      working-directory: ./mobile

    - name: Run widget tests
      env:
        FLUTTER_TEST: true
      run: |
        echo "🎨 Executando Widget Tests..."
        if [ -d "test/widget/" ] && [ "$(ls -A test/widget/)" ]; then
          flutter test test/widget/ --reporter expanded --coverage
        else
          echo "⚠️ Diretório test/widget/ vazio ou não encontrado"
          echo "ℹ️ Pulando widget tests"
        fi
      working-directory: ./mobile

    - name: Run integration tests (if available)
      env:
        FLUTTER_TEST: true
        ENABLE_INTEGRATION_TESTS: false
      run: |
        echo "🔄 Verificando Integration Tests..."
        if [ "$ENABLE_INTEGRATION_TESTS" = "true" ] && [ -d "integration_test/" ] && [ "$(ls -A integration_test/)" ]; then
          echo "📱 Executando Integration Tests..."
          # Verificar se há dispositivos disponíveis
          flutter devices --machine > devices.json
          if [ -s devices.json ] && [ "$(cat devices.json)" != "[]" ]; then
            flutter test integration_test/ --reporter expanded
          else
            echo "⚠️ Nenhum dispositivo disponível para testes de integração"
            echo "ℹ️ Pulando testes de integração no ambiente CI"
          fi
        else
          echo "ℹ️ Integration tests desabilitados ou não configurados - pulando"
        fi
      working-directory: ./mobile

    - name: Generate comprehensive test coverage
      env:
        FLUTTER_TEST: true
      run: |
        echo "📊 Gerando Relatório de Cobertura Completo..."
        # Executar todos os testes com cobertura
        flutter test --coverage --reporter expanded

        # Verificar se o arquivo de cobertura foi gerado
        if [ -f "coverage/lcov.info" ]; then
          echo "✅ Relatório de cobertura gerado: coverage/lcov.info"
          echo "📈 Primeiras linhas do relatório:"
          head -20 coverage/lcov.info
        else
          echo "⚠️ Arquivo de cobertura não encontrado"
        fi
      working-directory: ./mobile

    - name: Upload Flutter coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./mobile/coverage/lcov.info
        flags: flutter
        name: flutter-coverage
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload Flutter test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: flutter-test-results
        path: |
          mobile/coverage/
          mobile/test/

  # ===========================================
  # SECURITY SCAN - Análise de segurança
  # ===========================================
  security-scan:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke-tests

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install security tools
      run: |
        pip install -r backend/requirements.txt
        pip install safety bandit[toml]

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Python security scan with bandit
      run: |
        bandit -r backend/app/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --file backend/requirements.txt --output json > safety-report.json
      continue-on-error: true

    - name: Run security tests
      working-directory: ./backend
      env:
        # FORÇAR uso do banco local de teste - NUNCA usar secrets em testes
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_for_ci' }}
        CI: true
        GITHUB_ACTIONS: true
      run: |
        # Execute testes de segurança específicos
        pytest test/test_security.py -v --tb=short

        # Execute também testes marcados como security
        pytest -m security --tb=short -v
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: |
          trivy-results.sarif
          bandit-report.json
          safety-report.json

  # ===========================================
  # PERFORMANCE TESTS
  # ===========================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python with cache
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark psutil
        # Instalar modelo spaCy apenas se não existir
        python -c "import spacy; spacy.load('pt_core_news_sm')" 2>/dev/null || python -m spacy download pt_core_news_sm
      working-directory: ./backend

    - name: Setup performance test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d test_db -f - <<EOF
        CREATE TABLE IF NOT EXISTS departamentos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          orcamento DECIMAL(15,2)
        );
        CREATE TABLE IF NOT EXISTS funcionarios (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          cargo VARCHAR(100),
          salario DECIMAL(10,2),
          departamento_id INTEGER REFERENCES departamentos(id)
        );
        CREATE TABLE IF NOT EXISTS logs_perguntas (
          id SERIAL PRIMARY KEY,
          pergunta TEXT NOT NULL,
          sql_gerada TEXT,
          resposta TEXT,
          sucesso BOOLEAN DEFAULT FALSE,
          data_hora TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );
        INSERT INTO departamentos (nome, orcamento) VALUES ('Test Dept', 50000.00);
        INSERT INTO funcionarios (nome, cargo, salario, departamento_id) VALUES ('Test User', 'Test Role', 1000.00, 1);
        EOF

    - name: Run performance tests (PR - baseline)
      if: github.event_name == 'pull_request'
      working-directory: ./backend
      env:
        # FORÇAR uso do banco local de teste - NUNCA usar secrets em testes
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_for_ci' }}
        CI: true
        GITHUB_ACTIONS: true
      run: |
        # Execute testes de performance simples para baseline em PRs
        pytest test/performance/test_simple_performance.py -v --tb=short --maxfail=3

        # Execute também testes marcados como performance
        pytest -m performance --tb=short -v --maxfail=3

    - name: Run comprehensive performance tests (main branch)
      if: github.ref == 'refs/heads/main'
      working-directory: ./backend
      env:
        # FORÇAR uso do banco local de teste - NUNCA usar secrets em testes
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_for_ci' }}
        CI: true
        GITHUB_ACTIONS: true
      run: |
        # Execute todos os testes de performance específicos
        pytest \
          test/performance/test_benchmarks.py \
          test/performance/test_simple_performance.py \
          test/performance/test_performance_ci.py \
          --tb=short \
          -v \
          --durations=10

        # Execute também todos os testes do diretório performance
        pytest \
          test/performance/ \
          -m performance \
          --tb=short \
          -v \
          --durations=10

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: |
          backend/.benchmarks/

  # ===========================================
  # BUILD & DEPLOY - Artefatos de produção
  # ===========================================
  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [comprehensive-tests, comprehensive-flutter-tests, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Flutter Build
    - name: Setup Flutter for build
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        cache-key: flutter-build-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
        architecture: x64

    - name: Setup Java for Android build
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Prepare Flutter build environment
      timeout-minutes: 10
      env:
        GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      run: |
        # Verificar se Flutter foi instalado corretamente
        echo "🔧 Verificando instalação do Flutter..."
        flutter --version

        # Instalar dependências com retry
        echo "📦 Instalando dependências..."
        for i in {1..3}; do
          if flutter pub get; then
            echo "✅ Dependências instaladas com sucesso"
            break
          else
            echo "⚠️ Tentativa $i falhou, tentando novamente..."
            sleep 2
            if [ $i -eq 3 ]; then
              echo "❌ Falha ao instalar dependências após 3 tentativas"
              exit 1
            fi
          fi
        done

        # Validar configuração de build
        echo "🏥 Validando configuração de build..."
        flutter doctor -v

        # Verificar configuração do Android
        if [ -f "android/app/build.gradle" ]; then
          echo "✅ Configuração Android encontrada"
        else
          echo "⚠️ Configuração Android não encontrada"
        fi

        # Configurar Gradle para CI
        echo "⚙️ Configurando Gradle para ambiente CI..."
        mkdir -p ~/.gradle
        echo "org.gradle.vfs.watch=false" >> ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
        echo "✅ Gradle configurado para CI"
      working-directory: ./mobile

    - name: Build Flutter APK
      timeout-minutes: 15
      env:
        FLUTTER_BUILD: true
        GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      run: |
        echo "🔨 Construindo APK de produção..."

        # Limpar cache do Gradle primeiro
        echo "🧹 Limpando cache do Gradle..."
        if [ -f "android/gradlew" ]; then
          cd android && ./gradlew clean && cd ..
        fi

        # Build com retry em caso de falha
        for i in {1..2}; do
          if flutter build apk --release --verbose; then
            echo "✅ APK construído com sucesso na tentativa $i"
            break
          else
            echo "⚠️ Tentativa $i falhou, limpando cache..."
            flutter clean
            flutter pub get
            if [ $i -eq 2 ]; then
              echo "❌ Falha na construção do APK após 2 tentativas"
              exit 1
            fi
          fi
        done

        # Verificar se o APK foi gerado
        if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
          echo "✅ APK gerado com sucesso"
          echo "📦 Tamanho do APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
        else
          echo "❌ Falha na geração do APK"
          exit 1
        fi
      working-directory: ./mobile

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-app-release
        path: mobile/build/app/outputs/flutter-apk/app-release.apk

    # Backend Build
    - name: Setup Python for backend
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Create backend deployment package
      run: |
        pip install -r requirements.txt
        python -m spacy download pt_core_news_sm
        # Create deployment package excluding test files
        echo "📦 Criando pacote de deployment do backend..."
        tar -czf backend-deployment.tar.gz \
          --exclude="tests/" \
          --exclude="*.pyc" \
          --exclude="__pycache__/" \
          --exclude=".pytest_cache/" \
          --exclude="htmlcov/" \
          --exclude=".coverage" \
          . 2>/dev/null || echo "⚠️ Aviso do tar ignorado - arquivo criado com sucesso"
        echo "✅ Pacote de deployment criado"
      working-directory: ./backend

    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-deployment
        path: backend/backend-deployment.tar.gz

    - name: Generate deployment summary
      run: |
        echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "✅ Flutter APK built successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ Backend package created successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        echo "📦 Artifacts ready for deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Mobile App" >> $GITHUB_STEP_SUMMARY
        echo "- **APK Size**: $(du -h mobile/build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version**: ${{ env.FLUTTER_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🐍 Backend API" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Version**: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Size**: $(du -h backend/backend-deployment.tar.gz | cut -f1)" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # QUALITY GATE - Validação final
  # ===========================================
  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke-tests, comprehensive-tests, comprehensive-flutter-tests, security-scan, performance-tests]
    if: always()

    steps:
    - name: Evaluate quality gate
      run: |
        echo "## 🎯 Quality Gate Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check smoke tests
        if [ "${{ needs.smoke-tests.result }}" = "success" ]; then
          echo "✅ **Smoke Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Smoke Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        # Check comprehensive tests
        if [ "${{ needs.comprehensive-tests.result }}" = "success" ]; then
          echo "✅ **Comprehensive Backend Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Comprehensive Backend Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        # Check comprehensive Flutter tests
        if [ "${{ needs.comprehensive-flutter-tests.result }}" = "success" ]; then
          echo "✅ **Comprehensive Flutter Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Comprehensive Flutter Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        # Check security scan
        if [ "${{ needs.security-scan.result }}" = "success" ]; then
          echo "✅ **Security Scan**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Security Scan**: COMPLETED (check reports)" >> $GITHUB_STEP_SUMMARY
        fi

        # Check performance tests
        if [ "${{ needs.performance-tests.result }}" = "success" ]; then
          echo "✅ **Performance Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.performance-tests.result }}" = "skipped" ]; then
          echo "⏭️ **Performance Tests**: SKIPPED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Performance Tests**: ISSUES DETECTED" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

        # Overall gate decision
        if [ "${{ needs.smoke-tests.result }}" = "success" ] && [ "${{ needs.comprehensive-tests.result }}" = "success" ] && [ "${{ needs.comprehensive-flutter-tests.result }}" = "success" ]; then
          echo "🎉 **Overall Quality Gate**: ✅ PASSED" >> $GITHUB_STEP_SUMMARY
          echo "All critical validations successful. Ready for deployment!" >> $GITHUB_STEP_SUMMARY
        else
          echo "🚫 **Overall Quality Gate**: ❌ FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Critical tests failed. Deployment blocked." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const smokePassed = '${{ needs.smoke-tests.result }}' === 'success';
          const backendTestsPassed = '${{ needs.comprehensive-tests.result }}' === 'success';
          const flutterTestsPassed = '${{ needs.comprehensive-flutter-tests.result }}' === 'success';
          const securityPassed = '${{ needs.security-scan.result }}' === 'success';

          const allTestsPassed = smokePassed && backendTestsPassed && flutterTestsPassed;
          const status = allTestsPassed ? '✅ PASSED' : '❌ FAILED';
          const emoji = allTestsPassed ? '🎉' : '⚠️';

          const body = `${emoji} **Quality Gate Results**

          | Check | Status |
          |-------|--------|
          | Smoke Tests | ${smokePassed ? '✅' : '❌'} |
          | Backend Tests | ${backendTestsPassed ? '✅' : '❌'} |
          | Flutter Tests | ${flutterTestsPassed ? '✅' : '❌'} |
          | Security Scan | ${securityPassed ? '✅' : '⚠️'} |

          **Overall Status**: ${status}

          ${allTestsPassed ?
            'All critical tests passed! This PR is ready for review.' :
            'Some tests failed. Please review the workflow results.'}`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
