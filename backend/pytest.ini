# backend/pytest.ini
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=70
    --maxfail=10
    --durations=10

markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests (> 1s)
    performance: Performance tests
    external: Tests that require external services
    critical: Critical infrastructure tests
    smoke: Basic smoke tests for rapid validation
    infrastructure: Infrastructure and environment tests
    data_quality: Data quality and integrity tests
    real_scenarios: Real-world usage scenario tests
    concurrent: Concurrency and multi-user tests
    security: Security and validation tests
    nlp: Natural language processing tests
    benchmark: Benchmark tests for performance measurement

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:google.*
