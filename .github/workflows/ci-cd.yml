# ================================================================================
# SOPHOS KODIAK - OPTIMIZED CI/CD PIPELINE
# ================================================================================
#
# Pipeline otimizado para execução eficiente e confiável dos testes do projeto
# Sophos Kodiak, com foco em qualidade, performance e boas práticas.
#
# ESTRUTURA OTIMIZADA:
#
# 1. 🚀 SMOKE TESTS (execução rápida - ~3min)
#    - Validação básica do backend e Flutter
#    - Detecção rápida de problemas críticos
#
# 2. 🔥 COMPREHENSIVE TESTS (execução paralela)
#    - Backend: Todos os testes com DB real, sem mocks
#    - Flutter: Testes unitários, widget e integração
#    - Cobertura de código completa
#
# 3. 🔒 SECURITY SCAN (execução paralela)
#    - Análise de vulnerabilidades
#    - Testes de segurança específicos
#
# 4. ⚡ PERFORMANCE TESTS (condicional)
#    - PR: baseline rápido
#    - Main: suíte completa
#
# 5. 🚀 BUILD & DEPLOY (apenas main)
#    - Artefatos de produção
#    - APK Flutter e package backend
#
# MARCADORES PYTEST:
# - smoke, critical, unit, integration, performance, security, real_scenarios
#
# MELHORIAS IMPLEMENTADAS:
# - Cache otimizado para dependências
# - Execução paralela de jobs independentes
# - Remoção de redundâncias
# - Configuração simplificada e reutilizável
# - Timeouts apropriados
# - Validação de ambiente real (sem mocks)
# ================================================================================

name: Sophos Kodiak CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.32.4'
  POSTGRES_VERSION: '15.8'
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

jobs:
  # ===========================================
  # SMOKE TESTS - Validação rápida e básica
  # ===========================================
  smoke-tests:
    name: 🚀 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        component: [backend, frontend]

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend smoke tests
    - name: Setup Python (Backend)
      if: matrix.component == 'backend'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install Python dependencies (Backend)
      if: matrix.component == 'backend'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: ./backend

    - name: Setup test database
      if: matrix.component == 'backend'
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d test_db -f - <<EOF
        CREATE TABLE IF NOT EXISTS departamentos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          orcamento DECIMAL(15,2)
        );
        CREATE TABLE IF NOT EXISTS funcionarios (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          cargo VARCHAR(100),
          salario DECIMAL(10,2),
          departamento_id INTEGER REFERENCES departamentos(id)
        );
        CREATE TABLE IF NOT EXISTS logs_perguntas (
          id SERIAL PRIMARY KEY,
          pergunta TEXT NOT NULL,
          sql_gerada TEXT,
          resposta TEXT,
          sucesso BOOLEAN DEFAULT FALSE,
          data_hora TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );
        EOF

    - name: Run backend smoke tests
      if: matrix.component == 'backend'
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_for_ci' }}
        PYTHONPATH: ${{ github.workspace }}/backend
      run: pytest -m smoke -v --tb=short --maxfail=3

    # Frontend smoke tests
    - name: Setup Flutter (Frontend)
      if: matrix.component == 'frontend'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Setup Java for Android
      if: matrix.component == 'frontend'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Get Flutter dependencies
      if: matrix.component == 'frontend'
      run: flutter pub get
      working-directory: ./mobile

    - name: Analyze Flutter code
      if: matrix.component == 'frontend'
      run: flutter analyze
      working-directory: ./mobile

    - name: Run Flutter smoke tests
      if: matrix.component == 'frontend'
      run: |
        # Execute smoke test básico
        flutter test test/widget_test.dart
        # Verifica se a estrutura de testes está correta
        flutter test test/unit/models/ --reporter expanded || echo "Unit tests directory found"
        flutter test test/widget/ --reporter expanded || echo "Widget tests directory found"
      working-directory: ./mobile

  # ===========================================
  # COMPREHENSIVE TESTS - Suíte completa de testes
  # ===========================================
  comprehensive-tests:
    name: 🧪 Comprehensive Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smoke-tests

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python with cache
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies and tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-html flake8
        python -m spacy download pt_core_news_sm
      working-directory: ./backend

    - name: Setup comprehensive test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d test_db -f - <<EOF
        -- Complete database structure for comprehensive tests
        CREATE TABLE IF NOT EXISTS departamentos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          orcamento DECIMAL(15,2)
        );

        CREATE TABLE IF NOT EXISTS funcionarios (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          cargo VARCHAR(100),
          salario DECIMAL(10,2),
          departamento_id INTEGER REFERENCES departamentos(id)
        );

        CREATE TABLE IF NOT EXISTS clientes (
          id SERIAL PRIMARY KEY,
          nome_empresa VARCHAR(200) NOT NULL,
          data_cadastro DATE DEFAULT CURRENT_DATE
        );

        CREATE TABLE IF NOT EXISTS projetos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(200) NOT NULL,
          status VARCHAR(50),
          orcamento DECIMAL(15,2),
          cliente_id INTEGER REFERENCES clientes(id),
          responsavel_id INTEGER REFERENCES funcionarios(id),
          data_inicio DATE DEFAULT CURRENT_DATE,
          data_termino DATE
        );

        CREATE TABLE IF NOT EXISTS vendas (
          id SERIAL PRIMARY KEY,
          valor DECIMAL(15,2) NOT NULL,
          data_venda DATE DEFAULT CURRENT_DATE,
          projeto_id INTEGER REFERENCES projetos(id),
          funcionario_id INTEGER REFERENCES funcionarios(id),
          status_pagamento VARCHAR(50) DEFAULT 'Pendente'
        );

        CREATE TABLE IF NOT EXISTS contratos_marketing (
          id SERIAL PRIMARY KEY,
          descricao TEXT,
          valor DECIMAL(15,2),
          valor_total DECIMAL(15,2),
          cliente_id INTEGER REFERENCES clientes(id),
          data_inicio DATE DEFAULT CURRENT_DATE,
          data_termino DATE,
          status VARCHAR(50) DEFAULT 'Ativo'
        );

        CREATE TABLE IF NOT EXISTS logs_perguntas (
          id SERIAL PRIMARY KEY,
          pergunta TEXT NOT NULL,
          sql_gerada TEXT,
          resposta TEXT,
          sucesso BOOLEAN DEFAULT FALSE,
          data_hora TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );

        -- Test data
        INSERT INTO departamentos (nome, orcamento) VALUES
        ('Vendas', 100000.00),
        ('Marketing', 80000.00),
        ('Criação', 60000.00);

        INSERT INTO funcionarios (nome, cargo, salario, departamento_id) VALUES
        ('João Silva', 'Gerente', 5000.00, 1),
        ('Maria Santos', 'Analista', 4000.00, 2);

        INSERT INTO clientes (nome_empresa) VALUES
        ('Empresa Alpha'),
        ('Beta Corporation');
        EOF

    - name: Code quality check
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      working-directory: ./backend

    - name: Run comprehensive test suite
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key_for_ci' }}
      run: |
        # Execute todos os testes principais com cobertura
        pytest \
          tests/test_critical_infrastructure.py \
          tests/test_data_quality.py \
          tests/test_endpoints.py \
          tests/test_infrastructure.py \
          tests/test_real_scenarios.py \
          tests/test_security.py \
          tests/unit/ \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --tb=short \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: comprehensive-test-results
        path: |
          backend/htmlcov/
          backend/.coverage

  # ===========================================
  # COMPREHENSIVE FLUTTER TESTS - Suíte completa de testes Flutter
  # ===========================================
  comprehensive-flutter-tests:
    name: 📱 Comprehensive Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Setup Java for Android
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Get Flutter dependencies
      run: flutter pub get
      working-directory: ./mobile

    - name: Run code analysis
      run: flutter analyze
      working-directory: ./mobile

    - name: Run unit tests
      run: |
        echo "🧪 Running Unit Tests..."
        flutter test test/unit/ --reporter expanded
      working-directory: ./mobile

    - name: Run widget tests
      run: |
        echo "🎨 Running Widget Tests..."
        flutter test test/widget/ --reporter expanded
      working-directory: ./mobile

    - name: Run integration tests
      run: |
        echo "🔄 Running Integration Tests..."
        flutter test integration_test/ --reporter expanded
      working-directory: ./mobile

    - name: Generate test coverage
      run: |
        echo "📊 Generating Coverage Report..."
        flutter test --coverage
        echo "Coverage report generated at coverage/lcov.info"
      working-directory: ./mobile

    - name: Upload Flutter coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./mobile/coverage/lcov.info
        flags: flutter
        name: flutter-coverage
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload Flutter test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: flutter-test-results
        path: |
          mobile/coverage/
          mobile/test/

  # ===========================================
  # SECURITY SCAN - Análise de segurança
  # ===========================================
  security-scan:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke-tests

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install security tools
      run: |
        pip install -r backend/requirements.txt
        pip install safety bandit[toml]

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Python security scan with bandit
      run: |
        bandit -r backend/app/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --file backend/requirements.txt --output json > safety-report.json
      continue-on-error: true

    - name: Run security tests
      working-directory: ./backend
      env:
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: |
        # Execute testes de segurança específicos
        pytest tests/test_security.py -v --tb=short

        # Execute também testes marcados como security
        pytest -m security --tb=short -v
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: |
          trivy-results.sarif
          bandit-report.json
          safety-report.json

  # ===========================================
  # PERFORMANCE TESTS
  # ===========================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python with cache
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark psutil
        python -m spacy download pt_core_news_sm
      working-directory: ./backend

    - name: Setup performance test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d test_db -f - <<EOF
        CREATE TABLE IF NOT EXISTS departamentos (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          orcamento DECIMAL(15,2)
        );
        CREATE TABLE IF NOT EXISTS funcionarios (
          id SERIAL PRIMARY KEY,
          nome VARCHAR(100) NOT NULL,
          cargo VARCHAR(100),
          salario DECIMAL(10,2),
          departamento_id INTEGER REFERENCES departamentos(id)
        );
        CREATE TABLE IF NOT EXISTS logs_perguntas (
          id SERIAL PRIMARY KEY,
          pergunta TEXT NOT NULL,
          sql_gerada TEXT,
          resposta TEXT,
          sucesso BOOLEAN DEFAULT FALSE,
          data_hora TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );
        INSERT INTO departamentos (nome, orcamento) VALUES ('Test Dept', 50000.00);
        INSERT INTO funcionarios (nome, cargo, salario, departamento_id) VALUES ('Test User', 'Test Role', 1000.00, 1);
        EOF

    - name: Run performance tests (PR - baseline)
      if: github.event_name == 'pull_request'
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
      run: |
        # Execute testes de performance simples para baseline em PRs
        pytest tests/performance/test_simple_performance.py -v --tb=short --maxfail=3

        # Execute também testes marcados como performance
        pytest -m performance --tb=short -v --maxfail=3

    - name: Run comprehensive performance tests (main branch)
      if: github.ref == 'refs/heads/main'
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        FLASK_ENV: testing
        PYTHONPATH: ${{ github.workspace }}/backend
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
      run: |
        # Execute todos os testes de performance específicos
        pytest \
          tests/performance/test_benchmarks.py \
          tests/performance/test_simple_performance.py \
          tests/performance/test_performance_ci.py \
          --tb=short \
          -v \
          --durations=10

        # Execute também todos os testes do diretório performance
        pytest \
          tests/performance/ \
          -m performance \
          --tb=short \
          -v \
          --durations=10

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: |
          backend/.benchmarks/

  # ===========================================
  # BUILD & DEPLOY - Artefatos de produção
  # ===========================================
  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [comprehensive-tests, comprehensive-flutter-tests, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Flutter Build
    - name: Setup Flutter with cache
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Setup Java for Android
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Get Flutter dependencies
      run: flutter pub get
      working-directory: ./mobile

    - name: Build Flutter APK
      run: flutter build apk --release
      working-directory: ./mobile

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-app-release
        path: mobile/build/app/outputs/flutter-apk/app-release.apk

    # Backend Build
    - name: Setup Python for backend
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Create backend deployment package
      run: |
        pip install -r requirements.txt
        python -m spacy download pt_core_news_sm
        # Create deployment package excluding test files
        tar -czf backend-deployment.tar.gz \
          --exclude="tests/" \
          --exclude="*.pyc" \
          --exclude="__pycache__/" \
          --exclude=".pytest_cache/" \
          --exclude="htmlcov/" \
          --exclude=".coverage" \
          .
      working-directory: ./backend

    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-deployment
        path: backend/backend-deployment.tar.gz

    - name: Generate deployment summary
      run: |
        echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "✅ Flutter APK built successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ Backend package created successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        echo "📦 Artifacts ready for deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Mobile App" >> $GITHUB_STEP_SUMMARY
        echo "- **APK Size**: $(du -h mobile/build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version**: ${{ env.FLUTTER_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🐍 Backend API" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Version**: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Size**: $(du -h backend/backend-deployment.tar.gz | cut -f1)" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # QUALITY GATE - Validação final
  # ===========================================
  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke-tests, comprehensive-tests, comprehensive-flutter-tests, security-scan, performance-tests]
    if: always()

    steps:
    - name: Evaluate quality gate
      run: |
        echo "## 🎯 Quality Gate Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check smoke tests
        if [ "${{ needs.smoke-tests.result }}" = "success" ]; then
          echo "✅ **Smoke Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Smoke Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        # Check comprehensive tests
        if [ "${{ needs.comprehensive-tests.result }}" = "success" ]; then
          echo "✅ **Comprehensive Backend Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Comprehensive Backend Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        # Check comprehensive Flutter tests
        if [ "${{ needs.comprehensive-flutter-tests.result }}" = "success" ]; then
          echo "✅ **Comprehensive Flutter Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Comprehensive Flutter Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        # Check security scan
        if [ "${{ needs.security-scan.result }}" = "success" ]; then
          echo "✅ **Security Scan**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Security Scan**: COMPLETED (check reports)" >> $GITHUB_STEP_SUMMARY
        fi

        # Check performance tests
        if [ "${{ needs.performance-tests.result }}" = "success" ]; then
          echo "✅ **Performance Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.performance-tests.result }}" = "skipped" ]; then
          echo "⏭️ **Performance Tests**: SKIPPED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Performance Tests**: ISSUES DETECTED" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

        # Overall gate decision
        if [ "${{ needs.smoke-tests.result }}" = "success" ] && [ "${{ needs.comprehensive-tests.result }}" = "success" ] && [ "${{ needs.comprehensive-flutter-tests.result }}" = "success" ]; then
          echo "🎉 **Overall Quality Gate**: ✅ PASSED" >> $GITHUB_STEP_SUMMARY
          echo "All critical validations successful. Ready for deployment!" >> $GITHUB_STEP_SUMMARY
        else
          echo "🚫 **Overall Quality Gate**: ❌ FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Critical tests failed. Deployment blocked." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const smokePassed = '${{ needs.smoke-tests.result }}' === 'success';
          const backendTestsPassed = '${{ needs.comprehensive-tests.result }}' === 'success';
          const flutterTestsPassed = '${{ needs.comprehensive-flutter-tests.result }}' === 'success';
          const securityPassed = '${{ needs.security-scan.result }}' === 'success';

          const allTestsPassed = smokePassed && backendTestsPassed && flutterTestsPassed;
          const status = allTestsPassed ? '✅ PASSED' : '❌ FAILED';
          const emoji = allTestsPassed ? '🎉' : '⚠️';

          const body = `${emoji} **Quality Gate Results**

          | Check | Status |
          |-------|--------|
          | Smoke Tests | ${smokePassed ? '✅' : '❌'} |
          | Backend Tests | ${backendTestsPassed ? '✅' : '❌'} |
          | Flutter Tests | ${flutterTestsPassed ? '✅' : '❌'} |
          | Security Scan | ${securityPassed ? '✅' : '⚠️'} |

          **Overall Status**: ${status}

          ${allTestsPassed ?
            'All critical tests passed! This PR is ready for review.' :
            'Some tests failed. Please review the workflow results.'}`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
